name: Compile Examples

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  platformio:
    name: ${{ matrix.example }} on ${{ matrix.board }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - example: examples/BasicJog/BasicJog.ino
            board: megaatmega2560
          - example: examples/BasicJog/BasicJog.ino
            board: teensy41
          - example: examples/BasicJog/BasicJog.ino
            board: esp32dev
          - example: examples/MonitorStatus/MonitorStatus.ino
            board: megaatmega2560
          - example: examples/MonitorStatus/MonitorStatus.ino
            board: teensy41
          - example: examples/MonitorStatus/MonitorStatus.ino
            board: esp32dev
          - example: examples/CommunicationCheck/CommunicationCheck.ino
            board: megaatmega2560
          - example: examples/CommunicationCheck/CommunicationCheck.ino
            board: teensy41
          - example: examples/CommunicationCheck/CommunicationCheck.ino
            board: esp32dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: platformio-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('library.properties') }}
          restore-keys: |
            platformio-${{ runner.os }}-${{ matrix.board }}-
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile example
        run: pio ci "${{ matrix.example }}" --lib "." --board "${{ matrix.board }}"
